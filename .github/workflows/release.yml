name: NiceChunk PoUW Miner release

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.88.0"
  NICECHUNK_CHUNK_JS_ROOT: ${{ github.workspace }}/.dependencies/chunk.js
  NICECHUNK_GAME_ROOT: ${{ github.workspace }}/.dependencies/game

jobs:
  quality:
    name: Protocol, WASM, and browser tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check out pinned Chunk.js browser runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nicechunk/chunk.js
          ref: 0198c1aeeadad513b6e05c75bdcbc31133d28776
          path: .dependencies/chunk.js
          persist-credentials: false
      - name: Check out pinned Game ChunkBroken decoder
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: nicechunk/game
          ref: 58241acf2ec3c408e1af173a947e3d85753fc739
          path: .dependencies/game
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt clippy
      - name: Install JavaScript test dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: npm ci --ignore-scripts
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.126 --locked --root .toolchains/wasm-bindgen
      - name: Rust formatting, lint, tests, and no-std check
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cargo check -p pouw-core --no-default-features
          cargo build -p pouw-cli
          target/debug/nicechunk-miner self-test
      - name: Build and compare native/WASM output
        run: |
          node scripts/build-web.mjs
          node scripts/check-web.mjs
          node scripts/test-wasm-consistency.mjs
      - name: Compare pinned production JavaScript codecs
        run: NODE_NO_WARNINGS=1 node scripts/test-js-codec-compatibility.mjs
      - name: Run benchmark smoke test
        run: cargo run --release -p pouw-cli -- --json benchmark --corpus test-vectors
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run responsive local-only browser smoke
        env:
          POUW_BROWSER_TARGETS: chromium,firefox,webkit
        run: node scripts/test-browser.mjs
      - name: Package Web/WASM test bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          node scripts/build-web-release.mjs --version "$VERSION" --dist web/dist --output artifacts/web
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: nicechunk-miner-web-wasm
          path: |
            artifacts/web/*.tar.gz
            artifacts/web/*.sha256
          if-no-files-found: error
          retention-days: 14

  property:
    name: Extended parser property tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
      - name: Run extended adversarial/property suite
        env:
          PROPTEST_CASES: "1024"
        run: cargo test --release -p pouw-core --test protocol_adversarial

  build:
    name: ${{ matrix.label }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x86_64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            platform: linux-x86_64
            binary: nicechunk-miner
          - label: Linux ARM64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            platform: linux-aarch64
            binary: nicechunk-miner
          - label: Windows x86_64
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            platform: windows-x86_64
            binary: nicechunk-miner.exe
          - label: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            platform: macos-aarch64
            binary: nicechunk-miner
          - label: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            platform: macos-x86_64
            binary: nicechunk-miner
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target "${{ matrix.target }}"
          rustup default "$RUST_VERSION"
      - name: Build and test native binary
        shell: bash
        run: |
          cargo test --workspace --target "${{ matrix.target }}"
          cargo build --release -p pouw-cli --target "${{ matrix.target }}"
          "target/${{ matrix.target }}/release/${{ matrix.binary }}" self-test
      - name: Package direct-run archive and checksums
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="$(node -p "require('./package.json').version")"
          fi
          node scripts/package-cli-release.mjs \
            --platform "${{ matrix.platform }}" \
            --version "$VERSION" \
            --binary "target/${{ matrix.target }}/release/${{ matrix.binary }}" \
            --output artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nicechunk-miner-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [quality, property, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true
      - name: Validate all artifacts and generate static manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          EXPECTED="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$EXPECTED"
          for archive in artifacts/*.tar.gz; do tar -tzf "$archive" >/dev/null; done
          for archive in artifacts/*.zip; do unzip -t "$archive" >/dev/null; done
          sha256sum artifacts/*.tar.gz artifacts/*.zip | sed 's#  artifacts/#  #' > artifacts/SHA256SUMS
          node scripts/generate-release-manifest.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --version "$VERSION" \
            --commit "$GITHUB_SHA" \
            --artifacts artifacts \
            --output release-manifest.json \
            --notes release-notes.md
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            artifacts/* release-manifest.json \
            --verify-tag \
            --prerelease \
            --title "NiceChunk PoUW Miner ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md
          gh release view "$GITHUB_REF_NAME" --json url,assets
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-manifest
          path: release-manifest.json
          if-no-files-found: error
          retention-days: 30
