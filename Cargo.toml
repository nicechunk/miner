[workspace]
resolver = "2"
members = [
  "crates/pouw-core",
  "crates/pouw-search",
  "crates/pouw-cli",
  "crates/pouw-wasm",
]

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/nicechunk"
authors = ["NiceChunk Contributors"]

[workspace.dependencies]
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
clap = { version = "4.5.40", features = ["derive"] }
ctrlc = "3.4.7"
getrandom = { version = "0.2.16", features = ["js"] }
js-sys = "0.3.77"
proptest = "1.7.0"
rand_chacha = "0.3.1"
rand_core = "0.6.4"
rayon = "1.10.0"
serde = { version = "1.0.219", default-features = false, features = ["alloc", "derive"] }
serde_json = "1.0.140"
sha2 = { version = "0.10.9", default-features = false }
wasm-bindgen = "0.2.100"
web-sys = { version = "0.3.77", features = ["console", "Performance"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true
