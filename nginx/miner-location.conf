# Include exactly once inside the existing nicechunk.com server block.
# The parent http/server configuration must load standard MIME types and gzip.

location = /miner {
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    return 308 /miner/;
}

location = /miner/ {
    alias /web/nicechunk/miner/current/;
    index index.html;
    default_type text/html;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
}

location = /miner/index.html {
    alias /web/nicechunk/miner/current/index.html;
    default_type text/html;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
}

location = /miner/release-manifest.json {
    alias /web/nicechunk/miner/current/release-manifest.json;
    default_type application/json;
    add_header Cache-Control "no-cache, must-revalidate" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
}

location ~ "^/miner/assets/(?<miner_wasm>[A-Za-z0-9_-]+\.[0-9a-f]{12}\.wasm)$" {
    alias /web/nicechunk/miner/current/assets/$miner_wasm;
    default_type application/wasm;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
}

location ~ "^/miner/assets/(?<miner_asset>(?:locales/|samples/)?[A-Za-z0-9_-]+\.[0-9a-f]{12}\.(?:js|css|png|json|ncbk|ncm3|ncf1))$" {
    alias /web/nicechunk/miner/current/assets/$miner_asset;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
}

# Executable and data paths never fall through to the website SPA.
location ~ ^/miner/.*\.(?:js|mjs|wasm|css|json)$ {
    return 404;
}

location /miner/ {
    return 404;
}
